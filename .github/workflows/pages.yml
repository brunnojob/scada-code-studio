name: Publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm ci --prefix .proof/browser
      - run: .proof/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test production build in Chromium
        run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-browser-proof
          path: |
            docs/proof/browser.png
            docs/proof/scada-session.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
